---
- hosts: all
  # become: true
  remote_user: dietpi   # User to log into to run the playbook tasks
  tags: bootstrap
  vars:
    NORMAL_USER_NAME: "ansible"
  tasks:
    - name: "Create a secondary, non-root user"
      user:
        name: "{{ NORMAL_USER_NAME }}"
        # Password hash generated on https://www.mkpasswd.net/index.php using sha-512 and Category: sha
        password: "$6$Yncz4m42B2o9IDWO$Lsi4LWSi3OnvEmp92gVmwKquey4WuYnB./8SwsN7uxhpFh2OKVA7rJWtdf/hsbvkZxUIKc.ev6xpZAd9OiSNU."
        group: root
        # create_home: "no"
        shell: /bin/bash
    - name: "Add user ({{ NORMAL_USER_NAME }}) to sudoers"
      lineinfile:
        dest: /etc/sudoers
        regexp: "{{ NORMAL_USER_NAME }} ALL"
        line: "{{ NORMAL_USER_NAME }} ALL=(ALL) ALL"
        state: present

    - name: Add authorized key to user ({{ NORMAL_USER_NAME }}) 
      authorized_key:
        user: "{{ NORMAL_USER_NAME }}"
        key: "{{ lookup('file', './files/ansible.id_ed25519.pub') }}"

- hosts: all
  become: true   # root via dietpi passwordless sudo; 'ansible' user is not bootstrapped on current hosts
  tags: apt,pkg
  tasks:
    - name: Install htop
      package:
        name: htop
        state: latest

- hosts: all
  become: true   # root; do NOT become_user: ansible (user not present -> play fails)
  tags: always
  tasks:
    - name: Update cache & Upgrade all packages
      register: update_sys
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
    - name: Display the last line of the previous task to check the stats
      debug:
        msg:  "{{update_sys.stdout_lines|last}}"
    - name: Check whether a reboot is required (e.g. kernel upgraded)
      stat:
        path: /var/run/reboot-required
      register: reboot_required
    - name: Reboot host when apt flagged a reboot (kernel CVE fix)
      reboot:
        msg: "Rebooting after apt dist-upgrade (kernel upgrade)"
        reboot_timeout: 600
      when: reboot_required.stat.exists
