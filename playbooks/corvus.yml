---
# ============================================================================
# Corvus (edge reverse proxy + WAF) on rasphermes, managed by Ansible.
#
# This playbook does NOT install the Corvus image or track it. Images move;
# Ansible should manage the *declarative* bits (the compose file + the
# persistent data volume) and let Docker pull/upgrade the image itself.
#
# We bring the service up with a plain `docker compose` command (no Ansible
# docker collection needed — keeps it simple).
#
# Role in the network: rasphermes is the entrypoint + exitpoint. Corvus sits
# on ports 80/443 and forwards to your services (by private IP) which may live
# on other VLANs. It is plain HTTP forwarding for now — no Let's Encrypt, so
# it never needs the DuckDNS token. See docs/edge-corvus.md.
# ============================================================================

- hosts: rasphermes
  become: true
  gather_facts: true
  name: Install & manage Corvus edge proxy
  tags:
    - corvus
    - edge
    - proxy
    - duckdns   # prerequisite tag: the duckdns play must have run first (verify task below)

  vars:
    # Where the compose file + data live, INSIDE the container's data dir.
    # We write the file here and mount it read-write, then tell docker to use it.
    CORVUS_COMPOSE_PATH: "/data/corvus/docker-compose.yml"
    CORVUS_DATA_DIR:    "/data/corvus"
    # Names/IPs advertised to the Corvus admin console. Only used when the
    # console has TLS enabled; ignored for plain HTTP (current phase). Set this
    # to the PUBLIC address you'll reach the console at when you enable HTTPS,
    # e.g. "corvus.rasphermes.home,corvus.duckdns.org". Leave unset to use the
    # compose-file default.
    corvus_admin_hosts: "corvus.rasphermes.home,corvus.duckdns.org"

  tasks:
    # ---------------------------------------------------------------------
    # 0. Prerequisite guard: the duckdns play must have run first. It installs
    #    the updater and renders /etc/cron.d/duckdns; the token lives in
    #    /etc/duckdns/duckdns.env. Without it, this play can't do its job and
    #    should stop loudly instead of deploying a proxy that can't reach the
    #    box it needs to manage.
    # ---------------------------------------------------------------------
    - name: Verify the DuckDNS prerequisite (token env file) is in place
      assert:
        that:
          - lookup("file", "/etc/duckdns/duckdns.env", errors="skip") is not none
        fail_msg: |
          DuckDNS prerequisite not found.
          Run the duckdns play first:
            ansible rasphermes -i hosts -t duckdns \
              --user dietpi --private-key=~/.ssh/ansible.id_ed25519
          It installs the updater, writes /etc/cron.d/duckdns, and expects
          /etc/duckdns/duckdns.env (TOKEN + SUBDOMAIN) on the Pi.
        success_msg: "DuckDNS prerequisite OK (/etc/duckdns/duckdns.env present)"

    # ---------------------------------------------------------------------
    # 1. Persistent data volume. The container runs as uid/gid 10001, so chown it.
    #    We only create the dir + ownership — we never touch the image.
    # ---------------------------------------------------------------------
    - name: Ensure the Corvus data directory exists (owned by the container user)
      file:
        path: "{{ CORVUS_DATA_DIR }}"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"

    # ---------------------------------------------------------------------
    # 2. The compose file. This is the declarative source of truth: what
    #    services run, ports, networks, and env. Keep it under files/ so it is
    #    version controlled; Ansible copies it into the container each run.
    # ---------------------------------------------------------------------
    - name: Copy the Corvus docker-compose.yml into the container data dir
      copy:
        src: corvus/docker-compose.yml.j2
        dest: "{{ CORVUS_COMPOSE_PATH }}"
        owner: "10001"
        group: "10001"
        mode: "0644"

    # ---------------------------------------------------------------------
    # 3. Bring the service (re)up using the compose file we just wrote.
    #    `docker compose up -d` re-applies the compose file, so an upgrade just
    #    happens when the image changes and someone runs this play again.
    # ---------------------------------------------------------------------
    - name: (Re)start Corvus with the updated compose file
      command:
        cmd: "docker compose -f {{ CORVUS_COMPOSE_PATH }} up -d"
      register: corvus_up
      changed_when: true

    # ---------------------------------------------------------------------
    # 4. Sanity check: is Corvus answering on the admin console port (9443)?
    # ---------------------------------------------------------------------
    - name: Verify the Corvus admin console is reachable on :9443
      wait_for:
        host: 127.0.0.1
        port: 9443
        timeout: 120
      register: corvus_up_check
      until: corvus_up_check is succeeded
