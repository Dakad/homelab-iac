---
- hosts: rpi
  remote_user: dietpi   # User to log into to run the playbook tasks
  become: true          # root; do NOT become_user: ansible (user not present -> play fails)
  vars:
    NORMAL_USER_NAME: "ansible"
  tasks:
    - name: Update cache & Upgrade all packages
      register: update_sys
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
    - name: Display the last line of the previous task to check the stats
      debug:
        msg:  "{{update_sys.stdout_lines|last}}"
    - name: Check whether a reboot is required (e.g. kernel upgraded)
      stat:
        path: /var/run/reboot-required
      register: reboot_required
    - name: Reboot host when apt flagged a reboot (kernel CVE fix)
      reboot:
        msg: "Rebooting after apt dist-upgrade (kernel upgrade)"
        reboot_timeout: 600
      when: reboot_required.stat.exists
