---
    - name: "Create a secondary, non-root user '{{ ansible_user.name }}'"
      ansible.builtin.user:
        name: "{{ ansible_user.name }}"
        comment: ''
          # Password hash generated on https://www.mkpasswd.net/index.php?category=sha2 using type: sha-512 and Category: sha2
        password: "{{ ansible_user.password_hash }}"
        groups:
          - sudo
          - root
        generate_ssh_key: yes
        ssh_key_bits: 4096
        ssh_key_type: ed25519
        create_home: "no"
        shell: /bin/bash
    - name: "Add user ({{ ansible_user.name }}) to sudoers"
      lineinfile:
        dest: /etc/sudoers
        regexp: "{{ ansible_user.name }} ALL"
        line: "{{ ansible_user.name }} ALL=(ALL) ALL"
        state: present
        validate: 'visudo -cf %s'

    - name: Add authorized key to user ({{ ansible_user.name }})
      authorized_key:
        user: "{{ ansible_user.name }}"
        key: "{{ lookup('file', './files/ansible.id_ed25519.pub') }}"

- hosts: all
  remote_user: ansible
  become: true
  become_user: root
  tags: apt, pkg
  tasks:
    - debug:
        var: ansible_facts

    - name: Update cache & Upgrade all packages
      register: update_sys
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Display the last line of the previous task to check the stats
      debug:
        msg:  "{{update_sys.stdout_lines|last}}"

    - name: Install required packages depencies
      package:
        name:
          - acl
          - iptables
          - libnss-mdns
          - avahi-daemon
          - avahi-discover
          - avahi-utils
          - lm-sensors
        state: latest

- hosts: raspis
  gather_facts: True
  remote_user: ansible
  become: true
  become_user: root
  tags: etc_hosts
  tasks:
    - name: Generate /etc/hosts file
      when: hostvars[inventory_hostname]['ansible_facts']['default_ipv4'] is defined
      ansible.builtin.template:
        src: etc/hosts.j2
        dest: /etc/hosts.ansible
        owner: root
        group: root
        mode: u=rw,g=r,o=r
        # backup: yes

    - name: "check if debian generated hosts file has a backup"
      stat: "path=/etc/hosts.debia"
      register: etc_hosts_debian

    - name: "backup debian generated /etc/hosts"
      when: etc_hosts_debian.stat.islnk is not defined
      command: "cp /etc/hosts /etc/hosts.debian"

    - name: "install /etc/hosts.ansible file"
      command: "cp /etc/hosts.ansible /etc/hosts"
